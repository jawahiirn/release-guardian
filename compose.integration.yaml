name: release-guardian-integration

services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: release_guardian_test
      POSTGRES_USER: release_guardian_test
      POSTGRES_PASSWORD: release_guardian_test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_HOST_PORT:-55433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U release_guardian_test -d release_guardian_test"]
      interval: 2s
      timeout: 3s
      retries: 20
